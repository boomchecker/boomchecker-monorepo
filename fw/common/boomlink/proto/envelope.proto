syntax = "proto3";

package boomlink;

import "header.proto";
import "system.proto";

// Every BoomProtocol application message is one Envelope (boomlink.md
// section 7). It is the payload of a BoomLink DATA link frame (section 7.3);
// an ACK is a link-frame type with no Envelope at all.
message Envelope {
  MessageHeader header = 1;

  oneof payload {
    // Field numbers 10-13 (DetectionMessage/ConfigMessage/CommandMessage/
    // TelemetryMessage) are assigned by boomlink.md section 7 but not yet
    // implemented - PR 4 adds them alongside their own .proto files. Left
    // unnumbered here rather than `reserved`: `reserved` is for numbers that
    // were used and then removed, not ones not yet added.
    SystemMessage system = 14;
  }
}
