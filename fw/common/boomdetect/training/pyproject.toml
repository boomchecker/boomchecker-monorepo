[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boomdetect-train"
version = "0.1.0"
description = "Training, evaluation and C export for the boomdetect acoustic drone detector"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "scikit-learn>=1.4",
    "pyarrow>=14",
    "pandas>=2.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
bdtrain = "boomdetect_train.__main__:main"

[tool.setuptools.packages.find]
include = ["boomdetect_train*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
