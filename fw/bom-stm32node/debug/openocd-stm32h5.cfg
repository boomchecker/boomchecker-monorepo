# OpenOCD config for STM32H563 via ST-Link (DAP / SWD).
# Mirrors the flash invocation in Taskfile.yml so the debugger and the flash
# task use the same transport. Cortex-Debug cannot interleave `-c` between the
# `-f` config files, so the transport is selected here between interface and
# target, exactly as the Taskfile does.
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
source [find target/stm32h5x.cfg]
