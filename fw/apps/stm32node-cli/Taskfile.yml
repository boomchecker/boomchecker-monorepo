version: "3"

vars:
  VENV: .venv
  PY: "{{.VENV}}/bin/python"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: Create a local venv and install the package (editable) with dev deps
    cmds:
      - python3 -m venv {{.VENV}}
      - "{{.PY}} -m pip install --upgrade pip"
      - "{{.PY}} -m pip install -e '.[dev]'"

  run:
    desc: Launch the TUI (pass extra args after --, e.g. -- --port /dev/ttyACM0)
    cmds:
      - "{{.PY}} -m stm32node_cli tui {{.CLI_ARGS}}"

  test:
    desc: Run the test suite
    cmds:
      - "{{.PY}} -m pytest {{.CLI_ARGS}}"

  lint:
    desc: Lint with ruff
    cmds:
      - "{{.PY}} -m ruff check {{.CLI_ARGS}} ."

  proto:
    desc: Regenerate PROTOCOL.md from the protocol spec (single source of truth)
    cmds:
      - "{{.PY}} -m stm32node_cli.protocol.gen_docs"
