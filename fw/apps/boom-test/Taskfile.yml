version: "3"

vars:
  VENV: .venv
  PY: "{{.VENV}}/bin/python"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: Create a local venv and install the package (editable) with dev deps
    cmds:
      - python3 -m venv {{.VENV}}
      - "{{.PY}} -m pip install --upgrade pip"
      - "{{.PY}} -m pip install -e '.[dev]'"

  ports:
    desc: List connected boomchecker-node boards (USB VID:PID 0483:5710)
    cmds:
      - "{{.PY}} -m boom_test.discovery"

  test:
    desc: >
      Run the HIL suite (pass -- --master-port /dev/ttyACM0 --slave-port /dev/ttyACM1
      to pick roles explicitly; otherwise two connected boards are auto-discovered and
      paired). Tests skip cleanly if fewer than two boards are found.
    cmds:
      - "{{.PY}} -m pytest {{.CLI_ARGS}}"

  lint:
    desc: Lint with ruff
    cmds:
      - "{{.PY}} -m ruff check {{.CLI_ARGS}} ."
