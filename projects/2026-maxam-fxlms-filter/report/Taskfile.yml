version: "3"

tasks:
  build:
    desc: Build the FxLMS conference-style report PDF
    cmds:
      - pdflatex -interaction=nonstopmode -halt-on-error -output-directory=generated generated/fxlms_schema.tex
      - pdflatex -interaction=nonstopmode -halt-on-error -output-directory=generated generated/fxlms_schema_multiple.tex
      - pdflatex -interaction=nonstopmode -halt-on-error main.tex
      - bibtex main
      - pdflatex -interaction=nonstopmode -halt-on-error main.tex
      - pdflatex -interaction=nonstopmode -halt-on-error main.tex

  clean:
    desc: Remove generated report build artifacts
    cmds:
      - rm -f main.aux main.bbl main.blg main.log main.out main.pdf
      - rm -f generated/fxlms_schema.aux generated/fxlms_schema.log generated/fxlms_schema.pdf
      - rm -f generated/fxlms_schema.aux generated/fxlms_schema.log generated/fxlms_schema_multiple.pdf
