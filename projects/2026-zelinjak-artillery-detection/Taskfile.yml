version: "3"

tasks:
  manifest:
    desc: Generate normalized recording manifest and deterministic train/val/test split
    cmds:
      - python ml/generate_manifest.py

  features:
    desc: Generate MFCC feature matrices from the normalized manifest
    cmds:
      - python ml/prepare_features.py

  train:
    desc: Train the baseline CNN on generated MFCC features
    cmds:
      - python ml/train_model.py

  convert:
    desc: Convert the trained Keras model to an int8 TFLite model and C header
    cmds:
      - python ml/convert_model.py

  validate:pc:
    desc: Evaluate the generated TFLite model on the test split
    cmds:
      - python ml/evaluate_pc.py --model generated/models/model.tflite --format tflite --split test

  validate:esp:
    desc: Send test MFCC features to an ESP32-S3 over UART and report responses
    requires:
      vars: [ESPPORT]
    cmds:
      - python ml/validate_esp_uart.py --port {{.ESPPORT}} --split test

  firmware:build:
    desc: Build the ESP32-S3 firmware
    dir: firmware/esp32s3
    cmds:
      - idf.py build

  firmware:flash:
    desc: "Flash the ESP32-S3 firmware. Example: task firmware:flash ESPPORT=COM3"
    requires:
      vars: [ESPPORT]
    dir: firmware/esp32s3
    cmds:
      - idf.py -p {{.ESPPORT}} flash

  firmware:monitor:
    desc: "Open ESP-IDF serial monitor. Example: task firmware:monitor ESPPORT=COM3"
    requires:
      vars: [ESPPORT]
    dir: firmware/esp32s3
    cmds:
      - idf.py -p {{.ESPPORT}} monitor
