version: "3"

vars:
  PY: "{{.ROOT_DIR}}/venv/bin/python"

tasks:
  setup:
    desc: Install Python dependencies into a project-local venv
    cmds:
      - bash ./setup.sh

  manifest:
    desc: Generate normalized recording manifest and stratified 80/20 train/test split
    cmds:
      - "{{.PY}} ml/generate_manifest.py"

  features:
    desc: Generate clean MFCC feature matrices from the normalized manifest
    cmds:
      - "{{.PY}} ml/prepare_features.py"

  features:robustness:
    desc: Generate clean + waveform-domain SNR-swept (30/20/10/5 dB) MFCC features over the full corpus
    cmds:
      - "{{.PY}} ml/prepare_features.py --include-noisy --snr-db 30 20 10 5"

  train:
    desc: Train the baseline CNN on generated MFCC features
    cmds:
      - "{{.PY}} ml/train_model.py"

  convert:
    desc: Convert the trained Keras model to an int8 TFLite model and C header
    cmds:
      - "{{.PY}} ml/convert_model.py"

  validate:pc:
    desc: Evaluate the generated TFLite model on the test split
    cmds:
      - "{{.PY}} ml/evaluate_pc.py --model generated/models/model.tflite --format tflite --split test"

  robustness:pc:
    desc: "Run the waveform-domain SNR robustness sweep (Table II/III style) on PC. Example: task robustness:pc -- --model-keras archive/models/najlepsi_model.h5 --model-tflite archive/models/model.tflite"
    cmds:
      - "{{.PY}} ml/evaluate_robustness.py {{.CLI_ARGS}}"

  reproduce:pc:
    desc: "End-to-end camera-ready reproduction: multi-seed sweep, weight provenance, legacy-bug provenance, LaTeX tables + reviewer response"
    cmds:
      - "{{.PY}} ml/reproduce.py"
      - "{{.PY}} ml/convert_model.py --model archive/models/najlepsi_model.h5 --output generated/models/reconverted.tflite --header generated/models/reconverted_model_data.h"
      - "{{.PY}} ml/compare_tflite_weights.py --model-a archive/models/model.tflite --model-b generated/models/reconverted.tflite --output-csv generated/reports/weights_provenance_per_sample.csv"
      - "{{.PY}} ml/compare_weights.py --keras-model archive/models/najlepsi_model.h5 --tflite-model archive/models/model.tflite --output-csv generated/reports/weights_layers_archive_vs_h5.csv"
      - "{{.PY}} ml/compare_weights.py --keras-model archive/models/najlepsi_model.h5 --tflite-model generated/models/reconverted.tflite --output-csv generated/reports/weights_layers_reconverted_vs_h5.csv"
      - "{{.PY}} ml/evaluate_robustness.py --model-keras archive/models/najlepsi_model.h5 --model-tflite generated/models/reconverted.tflite --include-clean --output-csv generated/reports/quantization_effect_same_model.csv --per-sample-csv generated/reports/quantization_effect_same_model_per_sample.csv"
      - "{{.PY}} ml/reproduce.py --model-keras archive/models/najlepsi_model.h5 --model-tflite generated/models/reconverted.tflite --keras-label \"float32 (same model)\" --tflite-label \"int8 quantized (same model)\" --results-root generated/reports/quantization_effect_multiseed --no-legacy-csv"
      - "{{.PY}} ml/reproduce_legacy.py --output-csv generated/reports/legacy_bug_metrics.csv --per-sample-csv generated/reports/legacy_bug_per_sample.csv"
      - "{{.PY}} ml/make_deliverables.py"

  reproduce:clean:
    desc: "Remove regenerable reproduction artifacts. Never touches generated/results_ref_20260721/, or the hand-authored weights_provenance.md / provenance_table3.md reports (not regenerated by reproduce:pc)."
    cmds:
      - "rm -rf generated/features_seed42 generated/features_seed43 generated/features_seed44 generated/features_seed45 generated/features_seed46"
      - "rm -rf generated/results generated/models"
      - "find generated/reports -mindepth 1 -maxdepth 1 ! -name weights_provenance.md ! -name provenance_table3.md -exec rm -rf {} +"

  validate:esp:
    desc: Send test MFCC features to an ESP32-S3 over UART and report accuracy/latency statistics
    requires:
      vars: [ESPPORT]
    cmds:
      - "{{.PY}} ml/validate_esp_uart.py --port {{.ESPPORT}} --split test"

  firmware:build:
    desc: Build the ESP32-S3 firmware
    dir: firmware/esp32s3
    cmds:
      - idf.py build

  firmware:flash:
    desc: "Flash the ESP32-S3 firmware. Example: task firmware:flash ESPPORT=COM3"
    requires:
      vars: [ESPPORT]
    dir: firmware/esp32s3
    cmds:
      - idf.py -p {{.ESPPORT}} flash

  firmware:monitor:
    desc: "Open ESP-IDF serial monitor. Example: task firmware:monitor ESPPORT=COM3"
    requires:
      vars: [ESPPORT]
    dir: firmware/esp32s3
    cmds:
      - idf.py -p {{.ESPPORT}} monitor
