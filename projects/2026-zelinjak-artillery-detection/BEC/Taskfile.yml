version: "3"

vars:
  TEX_DIR: article
  TEX: article_main.tex
  JOB: article_main
  AUX_PREFIX: article/article_main
  CNN_FIG: sec3_cnn_architecture

tasks:
  cnn-figure:
    desc: Generate PlotNeuralNet CNN architecture figure
    cmds:
      - powershell -NoProfile -Command 'python scripts/generate_cnn_architecture.py; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; Push-Location article/figs; pdflatex -interaction=nonstopmode -halt-on-error {{.CNN_FIG}}.tex; $code = $LASTEXITCODE; Pop-Location; if ($code -ne 0) { exit $code }'

  build:
    desc: Compile {{.TEX_DIR}}/{{.TEX}} to {{.TEX_DIR}}/{{.JOB}}.pdf
    deps:
      - cnn-figure
    cmds:
      - powershell -NoProfile -Command 'Push-Location {{.TEX_DIR}}; pdflatex -interaction=nonstopmode -halt-on-error {{.TEX}}; if ($LASTEXITCODE -ne 0) { Pop-Location; exit $LASTEXITCODE }; bibtex {{.JOB}}; if ($LASTEXITCODE -ne 0) { Pop-Location; exit $LASTEXITCODE }; pdflatex -interaction=nonstopmode -halt-on-error {{.TEX}}; if ($LASTEXITCODE -ne 0) { Pop-Location; exit $LASTEXITCODE }; pdflatex -interaction=nonstopmode -halt-on-error {{.TEX}}; $code = $LASTEXITCODE; Pop-Location; if ($code -ne 0) { exit $code }'

  clean:
    desc: Remove LaTeX auxiliary files
    cmds:
      - powershell -NoProfile -Command "Remove-Item -ErrorAction SilentlyContinue {{.AUX_PREFIX}}.aux,{{.AUX_PREFIX}}.log,{{.AUX_PREFIX}}.out,{{.AUX_PREFIX}}.bbl,{{.AUX_PREFIX}}.blg,{{.AUX_PREFIX}}.toc,{{.AUX_PREFIX}}.synctex.gz,article/figs/{{.CNN_FIG}}.aux,article/figs/{{.CNN_FIG}}.log"

  rebuild:
    desc: Clean and compile again
    cmds:
      - task: clean
      - task: build

  # Retrain tasks run under Linux/WSL (unlike the PowerShell LaTeX tasks above) and use
  # the project venv one level up.
  retrain:splits:
    desc: Generate hard-coded train/val/test split (retrain/splits3.csv)
    dir: ..
    cmds:
      - venv/bin/python BEC/retrain/make_splits.py
    status:
      - test -f BEC/retrain/splits3.csv

  retrain:train:
    desc: "Train one seeded model with the proper 3-way protocol (default SEED=42; task retrain:train SEED=43)"
    dir: ..
    deps: [retrain:splits]
    vars:
      SEED: '{{.SEED | default "42"}}'
    cmds:
      - venv/bin/python BEC/retrain/train.py --seed {{.SEED}}

  retrain:train:all:
    desc: Train all five seeds (42-46) for mean +/- std reporting
    dir: ..
    deps: [retrain:splits]
    cmds:
      - for s in 42 43 44 45 46; do venv/bin/python BEC/retrain/train.py --seed $s || exit 1; done

  retrain-wf:features:
    desc: Generate waveform-noise augmentation features (seed 142, disjoint from eval seeds 42-46)
    dir: ..
    cmds:
      - venv/bin/python ml/prepare_features.py --include-noisy --snr-db 30 20 10 5 --seed 142 --output generated/features_trainaug_seed142
    status:
      - test -f generated/features_trainaug_seed142/features_manifest.csv

  retrain-wf:train:
    desc: "Train one seed with waveform-noise augmentation added (default SEED=42; task retrain-wf:train SEED=43)"
    dir: ..
    deps: [retrain:splits, retrain-wf:features]
    vars:
      SEED: '{{.SEED | default "42"}}'
    cmds:
      - venv/bin/python BEC/retrain-waveform/train.py --seed {{.SEED}}

  retrain-wf:train:all:
    desc: Train all five waveform-augmented seeds (42-46)
    dir: ..
    deps: [retrain:splits, retrain-wf:features]
    cmds:
      - for s in 42 43 44 45 46; do venv/bin/python BEC/retrain-waveform/train.py --seed $s || exit 1; done

  retrain-wf2:train:
    desc: "Train one seed with waveform-noise augmentation ONLY, no MFCC jitter (default SEED=42)"
    dir: ..
    deps: [retrain:splits, retrain-wf:features]
    vars:
      SEED: '{{.SEED | default "42"}}'
    cmds:
      - venv/bin/python BEC/retrain-waveform2/train.py --seed {{.SEED}}

  retrain-wf2:train:all:
    desc: Train all five waveform-only seeds (42-46)
    dir: ..
    deps: [retrain:splits, retrain-wf:features]
    cmds:
      - for s in 42 43 44 45 46; do venv/bin/python BEC/retrain-waveform2/train.py --seed $s || exit 1; done
