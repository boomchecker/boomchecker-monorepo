version: "3"

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list

  setup:
    desc: Create Python venv and install dependencies
    cmds:
      - bash ./setup.sh

  report:build:
    desc: Build the beamforming report PDF
    dir: report
    cmds:
      - task build

  report:clean:
    desc: Remove report build artifacts
    dir: report
    cmds:
      - task clean
