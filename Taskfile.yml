version: "3"

includes:
  fw:
    taskfile: ./fw/Taskfile.yml
    dir: ./fw
    optional: true
  api:
    taskfile: ./apps/api-backend/Taskfile.yml
    dir: ./apps/api-backend
    optional: true
  bot:
    taskfile: ./apps/boom-discord-bot/Taskfile.yml
    dir: ./apps/boom-discord-bot
    optional: true
  stm32-cli:
    taskfile: ./fw/apps/stm32node-cli/Taskfile.yml
    dir: ./fw/apps/stm32node-cli
    optional: true
  scripts:
    taskfile: ./scripts/Taskfile.yml
    dir: ./scripts
    optional: true

tasks:
  setup:
    desc: Bootstrap the workspace (install JS dependencies for all apps/packages)
    cmds:
      - pnpm install

  changeset:
    cmds:
      - pnpm changeset
    desc: Create a new changeset

  changeset:version:
    cmds:
      - pnpm changeset version
    desc: Apply versions from pending changesets

  docs:setup:
    desc: Install the docs toolchain (doxygen + graphviz, and a local venv with MkDocs Material + mkdoxy).
    cmds:
      # System dependency: doxygen (+ graphviz) — required by the mkdoxy plugin.
      - |
        set -euo pipefail
        if command -v doxygen >/dev/null 2>&1; then
          echo "doxygen already installed: $(doxygen --version)"
        elif command -v apt-get >/dev/null 2>&1; then
          echo "Installing doxygen + graphviz via apt-get..."
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
        else
          echo "ERROR: doxygen not found and apt-get unavailable. Install doxygen + graphviz manually." >&2
          exit 1
        fi
      # Python toolchain in an isolated venv (avoids PEP 668 externally-managed errors).
      - python3 -m venv .venv-docs
      - ./.venv-docs/bin/pip install --upgrade pip
      - ./.venv-docs/bin/pip install mkdocs-material mkdoxy
    status:
      - command -v doxygen >/dev/null 2>&1
      - test -x ./.venv-docs/bin/mkdocs

  docs:
    desc: Build the documentation site (MkDocs Material + mkdoxy) into ./site
    deps:
      - docs:setup
    cmds:
      - ./.venv-docs/bin/mkdocs build --strict

  docs:serve:
    desc: Live-preview the documentation at http://localhost:8000
    deps:
      - docs:setup
    cmds:
      - ./.venv-docs/bin/mkdocs serve

  latex:setup:
    desc: Install LaTeX packages needed to build reports
    cmds:
      - |
        set -euo pipefail
        if ! command -v apt-get >/dev/null 2>&1; then
          echo "apt-get not found; install TeX Live with pdflatex, bibtex, babel-czech, and recommended LaTeX packages."
          exit 1
        fi
        sudo apt-get update
        sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-lang-czechslovak texlive-fonts-recommended
