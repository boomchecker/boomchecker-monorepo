name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [ main ]
  # Build (but don't deploy) on PRs that touch docs, so `mkdocs build --strict`
  # catches a broken link or a nav problem in review instead of only when it
  # breaks the deploy on main.
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs-pages.yaml'
  workflow_dispatch:

# Least privilege at the top level; the deploy job below adds what it needs.
permissions:
  contents: read

concurrency:
  # Per-ref, so a PR build can't cancel main's deploy (and vice versa).
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Doxygen + Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # Major-version capped rather than floating: this builds with
          # --strict, so an upstream release that promotes any INFO-level
          # validation (e.g. nav.omitted_files) to a warning would turn the
          # docs deploy red with no change in this repo.
          pip install 'mkdocs-material>=9,<10' 'mkdoxy>=1.2,<2'

      - name: Build documentation
        run: |
          mkdocs build --strict -d site

      - name: Set custom domain
        run: echo "docs.boomchecker.cz" > site/CNAME

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: build
    # PRs build for validation only - never publish from one.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
