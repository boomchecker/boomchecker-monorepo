name: Test stm32node-cli

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'fw/apps/stm32node-cli/**'
      - '.github/workflows/test-stm32node-cli.yaml'

permissions:
  contents: read

# This package had no CI at all until now, which is how PROTOCOL.md came to
# describe a linear SVM and a 0.5 decision threshold months after the firmware
# had switched to an MLP with a logit threshold of 7.25: tests/test_protocol_docs.py
# already asserts PROTOCOL.md == gen_docs.render(), it simply never ran anywhere.
# That check only pins the generated doc to spec.py, not spec.py to the firmware -
# the firmware side becomes checkable once the classifier registry exports a
# machine-readable manifest - but the generated doc going stale relative to its
# own source is now caught.

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Pure-Python package; ruff reads only this directory.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: fw/apps/stm32node-cli/pyproject.toml

      - name: Install the package with dev extras
        working-directory: ./fw/apps/stm32node-cli
        run: pip install --quiet -e '.[dev]'

      - name: Ruff
        working-directory: ./fw/apps/stm32node-cli
        # Same command as `task lint`, so a green CI and a green local run mean
        # the same thing.
        run: ruff check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: fw/apps/stm32node-cli/pyproject.toml

      - name: Install the package with dev extras
        working-directory: ./fw/apps/stm32node-cli
        run: pip install --quiet -e '.[dev]'

      - name: Pytest
        working-directory: ./fw/apps/stm32node-cli
        # Includes test_protocol_docs.py, which fails if PROTOCOL.md was edited
        # by hand or if spec.py changed without running `task proto`.
        run: pytest -q

      - name: Build summary
        if: always()
        run: |
          {
            echo "### stm32node-cli"
            echo ""
            echo "- ruff clean (separate job)"
            echo "- pytest suite passed"
            echo "- PROTOCOL.md verified in sync with protocol/spec.py"
          } >> "$GITHUB_STEP_SUMMARY"
