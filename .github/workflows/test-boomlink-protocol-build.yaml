name: Test BoomLink Protocol Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.gitmodules'
      # A nanopb submodule version bump changes this gitlink, not
      # .gitmodules (which only changes on a url/path edit) - without this,
      # the only CI that actually runs generated encode/decode logic
      # wouldn't notice a nanopb update that changes decode behaviour (e.g.
      # bounds handling, unknown-field skipping).
      - 'fw/bom-stm32node/third_party/nanopb'
      - 'fw/common/boomlink/**'
      - '.github/workflows/test-boomlink-protocol-build.yaml'

permissions:
  contents: read

jobs:
  # A separate job rather than a step in test-build: ruff needs nothing the
  # cmake steps produce, and nothing they produce needs ruff. As a step it
  # had to either run last (so a style nit waits behind a full
  # configure+build+ctest) or first (so a style nit SUPPRESSES all C build
  # and test feedback for that push) - as its own job neither blocks the
  # other, both results land on the same push, and wall-clock is lower than
  # either ordering.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # No submodules: ruff only reads fw/common/boomlink/{tests,linkframe}.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: fw/common/boomlink/requirements.txt

      - name: Install Python dependencies
        working-directory: ./fw/common/boomlink
        run: pip install --quiet -r requirements.txt

      - name: Lint
        working-directory: ./fw/common/boomlink
        # ruff is configured (pyproject.toml) and available via `task lint`
        # for local use, but nothing previously ran it in CI - so it could
        # only ever catch a style issue if a developer remembered to run it
        # by hand. Matches `task lint` exactly.
        run: ruff check tests linkframe

  test-build:
    name: Build and test (host, Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # This job only reads the checkout to configure/build/test; it
          # never needs authenticated git access afterwards.
          persist-credentials: false

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: fw/common/boomlink/requirements.txt

      - name: Install Python dependencies
        working-directory: ./fw/common/boomlink
        run: pip install --quiet -r requirements.txt

      - name: Register GCC problem matcher
        # Without this, a compiler warning is neither a failure nor an
        # annotation - just text buried in a log nobody opens. That matters
        # because -Werror deliberately does NOT cover the four generated
        # *.pb.c (they are machine output from a vendored generator, so a
        # submodule bump should not hard-fail the build), and the claim that
        # warnings there are "still visible" is only true if something
        # surfaces them. This makes them PR annotations.
        run: echo "::add-matcher::.github/problem-matchers/gcc.json"

      - name: Configure
        working-directory: ./fw/common/boomlink
        run: cmake --preset Debug

      - name: Build
        working-directory: ./fw/common/boomlink
        run: cmake --build --preset Debug

      - name: Test
        working-directory: ./fw/common/boomlink
        run: ctest --preset Debug --output-on-failure

      - name: Verify the link layer has no Nanopb dependency
        working-directory: ./fw/common/boomlink
        # boomlink.md section 9: "BoomLink never decodes the Protobuf payload
        # and has no Nanopb dependency". The CMake target enforces it by not
        # linking Nanopb and not exposing the codec's include path, so a
        # violation is normally a compile error - but a future refactor could
        # re-add the link (to make something build) and quietly lose the
        # property, with every test still green. This fails the build instead.
        #
        # Each artefact's existence is asserted FIRST. Without that the check
        # fails OPEN: `if nm <missing file> | grep ...` prints an error to stderr
        # and takes the else branch, reporting success and exiting 0 (verified
        # under both `bash -e` and `bash -eo pipefail` - `set -e` does not apply
        # to a command in an `if` condition). Since a negative assertion is
        # vacuously true when there is nothing to inspect, the check would
        # silently disarm on exactly the refactor it exists to guard against -
        # the target being renamed, folded into a link-engine library, or given a
        # different output directory.
        #
        # The executable is checked too, and it is the stronger property: adding
        # boomlink_protocol to boomlink_linkframe_tool leaves the archive
        # byte-identical, so the archive check alone would pass while the tool
        # exercised the layer with a Protobuf decoder linked in - which is
        # precisely what the CMake comment claims would "make the boundary
        # untested".
        run: |
          set -euo pipefail
          status=0
          for artefact in build/Debug/libboomlink_linkframe.a build/Debug/boomlink_linkframe_tool; do
            if [ ! -f "$artefact" ]; then
              echo "❌ $artefact does not exist - this check cannot verify anything"
              status=1
              continue
            fi
            if nm "$artefact" | grep -E ' (U|T|t) pb_'; then
              echo "❌ $artefact references Nanopb symbols"
              status=1
            else
              echo "✅ $artefact is free of Nanopb symbols"
            fi
          done
          exit $status

      - name: Build summary
        run: |
          echo "### ✅ Build and tests successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Nanopb code generated from fw/common/boomlink/proto/*.proto ✓" >> $GITHUB_STEP_SUMMARY
          echo "- boomlink_protocol (host-native) built ✓" >> $GITHUB_STEP_SUMMARY
          echo "- boomlink_linkframe built, verified free of Nanopb symbols ✓" >> $GITHUB_STEP_SUMMARY
          echo "- C self-test + Python cross-language/compatibility suite passed ✓" >> $GITHUB_STEP_SUMMARY
          echo "- built with AddressSanitizer + UndefinedBehaviorSanitizer (BOOMLINK_SANITIZE, on by default for the Debug preset) ✓" >> $GITHUB_STEP_SUMMARY
          echo "- warnings are errors in the hand-written sources (BOOMLINK_WERROR, on by default for the Debug preset); the generated *.pb.c build with -Wall -Wextra and surface as annotations ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ruff lint runs as its own job (see the Lint check on this run)." >> $GITHUB_STEP_SUMMARY
