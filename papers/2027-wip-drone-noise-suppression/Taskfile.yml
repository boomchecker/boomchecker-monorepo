version: "3"

vars:
  TEX_DIR: article
  TEX: article_main.tex
  JOB: article_main
  AUX_PREFIX: article/article_main

tasks:
  setup:
    desc: Install LaTeX packages the article needs (IEEEtran from texlive-publishers, algorithmic from texlive-science)
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y texlive-publishers texlive-science
    status:
      - kpsewhich IEEEtran.cls
      - kpsewhich algorithmic.sty

  build:
    desc: Compile {{.TEX_DIR}}/{{.TEX}} to {{.TEX_DIR}}/{{.JOB}}.pdf
    deps: [setup]
    dir: '{{.TEX_DIR}}'
    cmds:
      - pdflatex -interaction=nonstopmode -halt-on-error {{.TEX}}
      - bibtex {{.JOB}}
      - pdflatex -interaction=nonstopmode -halt-on-error {{.TEX}}
      - pdflatex -interaction=nonstopmode -halt-on-error {{.TEX}}

  clean:
    desc: Remove LaTeX auxiliary files
    cmds:
      - rm -f {{.AUX_PREFIX}}.aux {{.AUX_PREFIX}}.log {{.AUX_PREFIX}}.out {{.AUX_PREFIX}}.bbl {{.AUX_PREFIX}}.blg {{.AUX_PREFIX}}.toc {{.AUX_PREFIX}}.synctex.gz

  rebuild:
    desc: Clean and compile again
    cmds:
      - task: clean
      - task: build
