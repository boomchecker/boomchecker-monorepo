services:
  fw-devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/fw-devcontainer/Dockerfile
    volumes:
      # Mount the root folder that contains .git
      - ../:/workspace:cached
      # Mount host SSH keys read-only; postCreateCommand copies them into ssh-data below
      - ${HOME}/.ssh:/home/boom/.ssh-host:ro
      # Persist SSH keys, seeded from the host on create (own copy, correct perms)
      - ssh-data:/home/boom/.ssh
      # Persist Codex config/history
      - codex-data:/home/boom/.codex
      # Persist Claude Code config/history
      - claude-data:/home/boom/.claude
    privileged: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    user: "1000"
    command: sleep infinity

  sw-devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/sw-devcontainer/Dockerfile
    volumes:
      # Mount the root folder that contains .git
      - ../:/workspace:cached
      # Mount host SSH keys read-only; postCreateCommand copies them into ssh-data below
      - ${HOME}/.ssh:/home/dev/.ssh-host:ro
      # Persist SSH keys, seeded from the host on create (own copy, correct perms)
      - ssh-data:/home/dev/.ssh
      # Persist Codex config/history
      - codex-data:/home/dev/.codex
      # Persist Claude Code config/history
      - claude-data:/home/dev/.claude
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: sleep infinity

volumes:
  codex-data:
  claude-data:
  ssh-data:
